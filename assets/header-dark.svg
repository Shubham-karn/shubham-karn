<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 210" role="img" aria-label="Shubham Karn — Full Stack Developer and AI Engineer, Kathmandu, Nepal">
  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#6366F1">
        <animate attributeName="stop-color" values="#6366F1;#8B5CF6;#EC4899;#8B5CF6;#6366F1" dur="10s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#EC4899">
        <animate attributeName="stop-color" values="#EC4899;#6366F1;#8B5CF6;#6366F1;#EC4899" dur="10s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <filter id="soften" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="55"/>
    </filter>
  </defs>
  <ellipse cx="170" cy="40" rx="250" ry="105" fill="#6366F1" opacity="0.15" filter="url(#soften)"/>
  <ellipse cx="840" cy="175" rx="250" ry="105" fill="#EC4899" opacity="0.11" filter="url(#soften)"/>
  <text x="500" y="98" text-anchor="middle" fill="#E6EDF3" style="font:600 56px 'Segoe UI','SF Pro Display','Helvetica Neue',Arial,sans-serif;letter-spacing:-1px">Shubham Karn</text>
  <rect x="428" y="120" width="144" height="4" rx="2" fill="url(#accent)"/>
  <text x="500" y="160" text-anchor="middle" fill="#9198A1" style="font:400 19px 'Segoe UI','SF Pro Display','Helvetica Neue',Arial,sans-serif;letter-spacing:0.4px">Full Stack Developer · AI Engineer · Kathmandu, Nepal</text>
</svg>

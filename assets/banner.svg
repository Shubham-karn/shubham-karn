<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 480" role="img" aria-label="Shubham Karn — Full Stack Developer and AI Engineer, Kathmandu, Nepal">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0D1126"/>
      <stop offset="0.55" stop-color="#111530"/>
      <stop offset="1" stop-color="#151A38"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8B5CF6"/>
      <stop offset="1" stop-color="#EC4899"/>
    </linearGradient>
    <radialGradient id="glowViolet" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#8B5CF6" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowPink" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#EC4899" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#EC4899" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#FFFFFF" stroke-opacity="0.03"/>
    </pattern>
    <clipPath id="frame">
      <rect x="4" y="4" width="1272" height="472" rx="30"/>
    </clipPath>
    <style>
      .sans { font-family: 'Segoe UI','SF Pro Display','Helvetica Neue',Arial,sans-serif; }
      .mono { font-family: 'Cascadia Code','JetBrains Mono',Consolas,'Courier New',monospace; }
    </style>
  </defs>

  <g clip-path="url(#frame)">
    <rect x="4" y="4" width="1272" height="472" fill="url(#bg)"/>
    <rect x="4" y="4" width="1272" height="472" fill="url(#grid)"/>
    <ellipse cx="380" cy="540" rx="620" ry="280" fill="url(#glowViolet)" opacity="0.9">
      <animate attributeName="opacity" values="0.9;0.6;0.9" dur="9s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="1080" cy="-30" rx="460" ry="240" fill="url(#glowPink)" opacity="0.9">
      <animate attributeName="opacity" values="0.9;0.65;0.9" dur="11s" repeatCount="indefinite"/>
    </ellipse>

    <!-- pill label -->
    <rect x="80" y="84" width="256" height="42" rx="21" fill="#FFFFFF" fill-opacity="0.04" stroke="#FFFFFF" stroke-opacity="0.1"/>
    <rect x="104" y="103" width="34" height="4" rx="2" fill="url(#accent)"/>
    <text x="154" y="111" class="sans" font-size="15" font-weight="600" letter-spacing="3" fill="#C4B5FD">PROFILE README</text>

    <!-- name / role / description -->
    <text x="78" y="196" class="sans" font-size="66" font-weight="700" letter-spacing="-1" fill="#F2F5FF">Shubham Karn</text>
    <text x="80" y="244" class="sans" font-size="27" font-weight="600" fill="#BAC2E0">Full Stack Developer <tspan fill="#8B5CF6">|</tspan> AI Engineer</text>
    <text x="80" y="298" class="sans" font-size="22" fill="#8A93B4">Building AI-powered products, scalable backends, and</text>
    <text x="80" y="332" class="sans" font-size="22" fill="#8A93B4">clean interfaces from Kathmandu, Nepal.</text>

    <!-- tech chips -->
    <rect x="80" y="372" width="172" height="44" rx="22" fill="#FFFFFF" fill-opacity="0.05" stroke="#FFFFFF" stroke-opacity="0.1"/>
    <text x="166" y="400" text-anchor="middle" class="sans" font-size="17" font-weight="500" fill="#CBD2EC">React + Next.js</text>
    <rect x="266" y="372" width="186" height="44" rx="22" fill="#FFFFFF" fill-opacity="0.05" stroke="#FFFFFF" stroke-opacity="0.1"/>
    <text x="359" y="400" text-anchor="middle" class="sans" font-size="17" font-weight="500" fill="#CBD2EC">Django + FastAPI</text>
    <rect x="466" y="372" width="182" height="44" rx="22" fill="#FFFFFF" fill-opacity="0.05" stroke="#FFFFFF" stroke-opacity="0.1"/>
    <text x="557" y="400" text-anchor="middle" class="sans" font-size="17" font-weight="500" fill="#CBD2EC">LangChain + RAG</text>

    <!-- decorative dots -->
    <circle cx="1116" cy="56" r="7" fill="#8B5CF6"/>
    <circle cx="1144" cy="56" r="7" fill="#EC4899"/>
    <circle cx="1172" cy="56" r="7" fill="#38BDF8"/>

    <!-- code card -->
    <ellipse cx="984" cy="250" rx="310" ry="190" fill="url(#glowViolet)"/>
    <rect x="760" y="96" width="448" height="296" rx="18" fill="#0A0E1E" stroke="#FFFFFF" stroke-opacity="0.09"/>
    <circle cx="794" cy="134" r="8" fill="#F471B5"/>
    <circle cx="822" cy="134" r="8" fill="#FBBF24"/>
    <circle cx="850" cy="134" r="8" fill="#34D399"/>

    <text x="792" y="196" class="mono" font-size="19"><tspan fill="#A78BFA">const</tspan><tspan fill="#7AA2F7"> shubham </tspan><tspan fill="#697098">= {</tspan></text>
    <text x="816" y="231" class="mono" font-size="19"><tspan fill="#D6DEF8">role</tspan><tspan fill="#697098">: </tspan><tspan fill="#FFC66D">"Full Stack"</tspan><tspan fill="#697098">,</tspan></text>
    <text x="816" y="266" class="mono" font-size="19"><tspan fill="#D6DEF8">focus</tspan><tspan fill="#697098">: [</tspan><tspan fill="#6EE7F0">"LLMs"</tspan><tspan fill="#697098">, </tspan><tspan fill="#6EE7F0">"RAG"</tspan><tspan fill="#697098">],</tspan></text>
    <text x="816" y="301" class="mono" font-size="19"><tspan fill="#D6DEF8">stack</tspan><tspan fill="#697098">: </tspan><tspan fill="#FFC66D">"Django + React"</tspan><tspan fill="#697098">,</tspan></text>
    <text x="816" y="336" class="mono" font-size="19"><tspan fill="#D6DEF8">basedIn</tspan><tspan fill="#697098">: </tspan><tspan fill="#F793C9">"Kathmandu"</tspan><tspan fill="#697098">,</tspan></text>
    <text x="792" y="371" class="mono" font-size="19"><tspan fill="#697098">};</tspan></text>
  </g>

  <rect x="4" y="4" width="1272" height="472" rx="30" fill="none" stroke="#FFFFFF" stroke-opacity="0.07"/>
</svg>

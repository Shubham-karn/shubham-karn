<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 500" role="img" aria-label="Shubham Karn — Full Stack Developer and AI Engineer, Kathmandu, Nepal">
  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6366F1"/>
      <stop offset="0.5" stop-color="#8B5CF6"/>
      <stop offset="1" stop-color="#EC4899"/>
    </linearGradient>
    <radialGradient id="heroGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#8B5CF6" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="heroClip"><rect x="24" y="24" width="736" height="296" rx="22"/></clipPath>
    <clipPath id="ctaClip"><rect x="776" y="336" width="480" height="140" rx="22"/></clipPath>
    <style>
      .sans { font-family: 'Segoe UI','SF Pro Display','Helvetica Neue',Arial,sans-serif; }
      .mono { font-family: 'Cascadia Code','JetBrains Mono',Consolas,'Courier New',monospace; }
      .label { font: 600 12px 'Segoe UI','SF Pro Display','Helvetica Neue',Arial,sans-serif; letter-spacing: 2.5px; fill: #6B7394; }
      .tile { fill: #10142A; stroke: #FFFFFF; stroke-opacity: 0.07; }
    </style>
  </defs>

  <!-- hero tile -->
  <rect class="tile" x="24" y="24" width="736" height="296" rx="22"/>
  <g clip-path="url(#heroClip)">
    <ellipse cx="120" cy="30" rx="420" ry="220" fill="url(#heroGlow)"/>
  </g>
  <rect x="64" y="64" width="64" height="64" rx="18" fill="url(#accent)"/>
  <text x="96" y="106" text-anchor="middle" class="sans" font-size="26" font-weight="700" fill="#FFFFFF">SK</text>
  <text x="62" y="192" class="sans" font-size="60" font-weight="700" letter-spacing="-1" fill="#F2F5FF">Shubham Karn</text>
  <text x="64" y="234" class="sans" font-size="24" fill="#A9B2D6">Full Stack Developer · AI Engineer</text>
  <circle cx="72" cy="274" r="5" fill="#34D399">
    <animate attributeName="opacity" values="1;0.35;1" dur="2.6s" repeatCount="indefinite"/>
  </circle>
  <text x="88" y="280" class="sans" font-size="18" fill="#7E88AB">Building AI-powered products at Time Charge N GO</text>

  <!-- focus tile -->
  <rect class="tile" x="776" y="24" width="480" height="140" rx="22"/>
  <text x="808" y="70" class="label">FOCUS</text>
  <text x="808" y="112" class="sans" font-size="26" font-weight="600" fill="#E7EBFA">LLMs · RAG · Agentic apps</text>
  <path d="M1204,52 C1206,62 1210,66 1220,68 C1210,70 1206,74 1204,84 C1202,74 1198,70 1188,68 C1198,66 1202,62 1204,52 Z" fill="url(#accent)">
    <animate attributeName="opacity" values="1;0.55;1" dur="4s" repeatCount="indefinite"/>
  </path>

  <!-- based-in tile -->
  <rect class="tile" x="776" y="180" width="232" height="140" rx="22"/>
  <text x="808" y="226" class="label">BASED IN</text>
  <text x="808" y="268" class="sans" font-size="20" font-weight="600" fill="#E7EBFA">Kathmandu, Nepal</text>

  <!-- experience tile -->
  <rect class="tile" x="1024" y="180" width="232" height="140" rx="22"/>
  <text x="1056" y="226" class="label">EXPERIENCE</text>
  <text x="1056" y="270" class="sans" font-size="26" font-weight="600" fill="#E7EBFA">3+ years</text>

  <!-- toolbox tile -->
  <rect class="tile" x="24" y="336" width="736" height="140" rx="22"/>
  <text x="64" y="380" class="label">TOOLBOX</text>
  <text x="64" y="414" class="mono" font-size="18" fill="#8A93B4">Python · TypeScript · Django · FastAPI · React</text>
  <text x="64" y="444" class="mono" font-size="18" fill="#8A93B4">Next.js · LangChain · Docker · Kubernetes · AWS</text>

  <!-- portfolio tile -->
  <rect x="776" y="336" width="480" height="140" rx="22" fill="url(#accent)"/>
  <g clip-path="url(#ctaClip)">
    <circle cx="1250" cy="340" r="90" fill="#FFFFFF" opacity="0.09"/>
    <circle cx="790" cy="480" r="70" fill="#FFFFFF" opacity="0.07"/>
  </g>
  <text x="1016" y="396" text-anchor="middle" class="label" style="fill:#FFFFFF;fill-opacity:0.75">PORTFOLIO</text>
  <text x="1016" y="434" text-anchor="middle" class="sans" font-size="26" font-weight="700" fill="#FFFFFF">shubhamkarn.com.np ↗</text>
</svg>
